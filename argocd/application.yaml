apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-management
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default


  source:
    repoURL: https://github.com/dxczek/devops-platform-gitops.git
    targetRevision: main
    path: base/app


  destination:
    server: https://kubernetes.default.svc
    namespace: task-management


  syncPolicy:
    automated:
      prune: true       
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
